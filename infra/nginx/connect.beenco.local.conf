# Beenco Connect internal intranet vhost.
# The Ubuntu host firewall and MikroTik filter chain are the perimeter.
# Do not expose this service to WAN, public DNS, tunnels, or port forwarding.

server {
    listen 0.0.0.0:80;
    server_name connect.beenco.local 10.170.0.10;

    return 301 https://$host$request_uri;
}

server {
    listen 0.0.0.0:443 ssl http2;
    server_name connect.beenco.local 10.170.0.10;

    ssl_certificate /etc/beenco/certs/portal.crt;
    ssl_certificate_key /etc/beenco/certs/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 16384m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
