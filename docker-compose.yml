name: beenco-connect

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: beenco
      POSTGRES_USER: beenco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BeencoPostgresLocal2026!}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beenco -d beenco"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - connect

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      PORTAL_DATA_DIR: /data
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL:-admin@beenco.local}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-Change@123}
      DATABASE_URL: postgresql://beenco:${POSTGRES_PASSWORD:-BeencoPostgresLocal2026!}@postgres:5432/beenco
    ports:
      - "${PORTAL_PORT:-4173}:4173"
    volumes:
      - portal-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - connect

volumes:
  postgres-data:
  portal-data:

networks:
  connect:
    driver: bridge
