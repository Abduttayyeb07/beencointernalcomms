openapi: 3.1.0
info:
  title: Beenco Connect API
  version: 0.1.0
  description: API-first contract for the self-hosted Beenco intranet portal.
servers:
  - url: https://connect.beenco.local/api
    description: Internal production endpoint behind Traefik
  - url: http://localhost:3000/api
    description: Local API adapter
security:
  - oidc: []
paths:
  /auth/session:
    get:
      tags: [Auth]
      summary: Return the current OIDC session and provisioned AD profile.
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create a database-backed employee account for local validation.
      description: Production should use Keycloak federated to Active Directory; this endpoint supports the local PostgreSQL-backed build.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignupRequest"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with a database-backed employee account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session and clear the browser cookie.
      responses:
        "200":
          description: Logged out
  /auth/google/start:
    get:
      tags: [Auth]
      summary: Start optional Google OAuth sign-up/login.
      description: Returns an OAuth authorization URL when Google credentials are configured; otherwise reports disabled configuration.
      responses:
        "200":
          description: Google OAuth status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  url:
                    type: string
                    format: uri
                  message:
                    type: string
  /users:
    get:
      tags: [Directory]
      summary: Search AD-provisioned users and local profile fields.
      parameters:
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /channels:
    get:
      tags: [Messaging]
      summary: List channels and DMs visible to the current user.
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      tags: [Messaging, Admin]
      summary: Create a public or private channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
  /channels/{channelId}/messages:
    get:
      tags: [Messaging]
      summary: Page through messages in a channel, DM, or group DM.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      tags: [Messaging]
      summary: Send a message with optional attachments and thread parent.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /messages/{messageId}:
    patch:
      tags: [Messaging]
      summary: Edit a message and retain edit history.
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      tags: [Messaging, Moderation]
      summary: Soft delete a message under retention/legal-hold rules.
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Deleted
  /messages/{messageId}/reactions:
    post:
      tags: [Messaging]
      summary: Add a reaction to a message.
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
      responses:
        "204":
          description: Reaction added
    delete:
      tags: [Messaging]
      summary: Remove a reaction from a message.
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Reaction removed
  /uploads:
    post:
      tags: [Files]
      summary: Create a tus resumable upload.
      description: Server rejects files larger than the configured default 15 GB cap or quota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
  /files/{fileId}/download:
    post:
      tags: [Files]
      summary: Issue a short-lived signed download URL and audit the access.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
  /search:
    get:
      tags: [Search]
      summary: Permission-scoped search over messages, filenames, and extracted file text.
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: channelId
          in: query
          schema:
            type: string
        - name: hasFile
          in: query
          schema:
            type: boolean
        - name: fileType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /calls/token:
    post:
      tags: [Calls]
      summary: Mint a scoped LiveKit room token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId]
              properties:
                roomId:
                  type: string
                canPublish:
                  type: boolean
                  default: true
                canSubscribe:
                  type: boolean
                  default: true
                canShareScreen:
                  type: boolean
                  default: true
      responses:
        "200":
          description: LiveKit token
          content:
            application/json:
              schema:
                type: object
                required: [token, roomId]
                properties:
                  token:
                    type: string
                  roomId:
                    type: string
  /events:
    get:
      tags: [Calendar]
      summary: List calendar events visible to the current user.
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      tags: [Calendar]
      summary: Create a company or AD-group targeted event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /announcements:
    post:
      tags: [Announcements]
      summary: Post an authorized org-wide or group-targeted announcement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementRequest"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
  /admin/retention:
    put:
      tags: [Admin, Retention]
      summary: Configure global and per-channel retention/legal-hold settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPolicy"
      responses:
        "204":
          description: Saved
  /audit:
    get:
      tags: [Audit]
      summary: Read audit events for authorized administrators.
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
    post:
      tags: [Audit]
      summary: Internal append-only audit event sink.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditEvent"
      responses:
        "202":
          description: Accepted
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.beenco.local/realms/beenco/.well-known/openid-configuration
  parameters:
    Query:
      name: q
      in: query
      schema:
        type: string
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Session:
      type: object
      required: [user, roles, groups]
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
    User:
      type: object
      required: [id, adObjectGuid, username, displayName, email, role, isActive]
      properties:
        id:
          type: string
        adObjectGuid:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        title:
          type: string
        department:
          type: string
        avatarUrl:
          type: string
          nullable: true
        presence:
          type: string
          enum: [online, away, offline, dnd]
        role:
          type: string
          enum: [super_admin, admin, moderator, member, guest]
        isActive:
          type: boolean
    AuthSignupRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthSessionResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    Channel:
      type: object
      required: [id, name, slug, type, members]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [public, private, dm, group_dm]
        topic:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            type: string
        retentionDays:
          type: integer
          nullable: true
        legalHold:
          type: boolean
    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [public, private]
        memberIds:
          type: array
          items:
            type: string
    Message:
      type: object
      required: [id, channelId, authorId, body, createdAt]
      properties:
        id:
          type: string
        channelId:
          type: string
        authorId:
          type: string
        parentId:
          type: string
          nullable: true
        body:
          type: string
        attachments:
          type: array
          items:
            type: string
        editedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
        attachments:
          type: array
          items:
            type: string
        parentId:
          type: string
          nullable: true
    CreateUploadRequest:
      type: object
      required: [filename, sizeBytes, mime, channelId]
      properties:
        filename:
          type: string
        sizeBytes:
          type: integer
          maximum: 16106127360
        mime:
          type: string
        channelId:
          type: string
    UploadSession:
      type: object
      required: [uploadId, tusUrl, maxFileSizeBytes]
      properties:
        uploadId:
          type: string
        tusUrl:
          type: string
          format: uri
        maxFileSizeBytes:
          type: integer
          example: 16106127360
    File:
      type: object
      required: [id, channelId, uploaderId, originalName, status, sizeBytes]
      properties:
        id:
          type: string
        channelId:
          type: string
        uploaderId:
          type: string
        originalName:
          type: string
        mime:
          type: string
        sizeBytes:
          type: integer
        status:
          type: string
          enum: [pending, available, quarantined]
        version:
          type: integer
        checksum:
          type: string
    SearchResponse:
      type: object
      required: [messages, files]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
    Event:
      type: object
      required: [id, title, startsAt, endsAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        location:
          type: string
        livekitRoom:
          type: string
        targetGroupId:
          type: string
          nullable: true
    CreateEventRequest:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        title:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        location:
          type: string
        targetGroupId:
          type: string
          nullable: true
        createLivekitRoom:
          type: boolean
          default: true
    Announcement:
      type: object
      required: [id, title, body, authorId, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        authorId:
          type: string
        targetGroupId:
          type: string
          nullable: true
        pinnedUntil:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateAnnouncementRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        targetGroupId:
          type: string
          nullable: true
        pinnedUntil:
          type: string
          format: date-time
          nullable: true
    RetentionPolicy:
      type: object
      properties:
        globalDays:
          type: integer
        channelId:
          type: string
        channelDays:
          type: integer
          nullable: true
        legalHold:
          type: boolean
    AuditEvent:
      type: object
      required: [actorId, action, targetType, targetId, createdAt]
      properties:
        actorId:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        ip:
          type: string
        userAgent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
